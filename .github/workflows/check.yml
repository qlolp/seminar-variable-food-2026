name: check

# Репозиторий — раздатка. Проверяем канонические файлы, живые ссылки
# и что кухня сборки не вернулась. Сборки из исходников больше нет.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить файлы для участников
        run: python3 .github/check_handout.py
