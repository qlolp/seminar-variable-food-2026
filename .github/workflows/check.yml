name: check

# LLM-wiki: каркас, сырьё в raw/, живые ссылки. Кухня сборки не должна вернуться.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить wiki и раздатку в raw/
        run: python3 .github/check_handout.py
