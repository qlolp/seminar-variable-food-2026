name: check

# LLM-wiki: каркас, frontmatter, wikilinks. Печатная раздатка не проверяется.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить структуру wiki
        run: python3 .github/check_wiki.py
