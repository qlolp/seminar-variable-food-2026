<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Раздел 5 — Закрытие</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #000; font-family: "Times New Roman", serif; }
.slide-content { width: 960px; height: 540px; position: relative; transform-origin: center center; background: #264653; }
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960, slideHeight = 540;
  const scale = Math.min(window.innerWidth / slideWidth, window.innerHeight / slideHeight);
  slide.style.width = slideWidth + 'px'; slide.style.height = slideHeight + 'px';
  slide.style.transform = 'scale(' + scale + ')'; slide.style.transformOrigin = 'center center'; slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#264653; font-family:'Times New Roman', serif; color:#ffffff;">

  <p style="position:absolute; left:60px; top:80px; margin:0; font-size:160px; line-height:1; font-weight:700; color:#e9c46a; letter-spacing:-4px;">05</p>

  <svg width="80" height="4" style="position:absolute; left:60px; top:280px;" aria-hidden="true">
    <rect width="80" height="4" fill="#e76f51"/>
  </svg>

  <h2 style="position:absolute; left:60px; top:300px; margin:0; font-size:54px; line-height:1.05; font-weight:700; color:#ffffff;">Закрытие</h2>

  <p style="position:absolute; left:60px; top:380px; width:760px; margin:0; font-size:18px; line-height:1.5; color:#c5d0d8; font-weight:400;">Что делать в&nbsp;понедельник. Десять выводов.<br/>Контакты и&nbsp;источники.</p>

  <svg width="320" height="320" style="position:absolute; right:60px; top:110px; opacity:0.2;" aria-hidden="true">
    <defs>
      <pattern id="dots27" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="2" fill="#e9c46a"/>
      </pattern>
    </defs>
    <rect width="320" height="320" fill="url(#dots27)"/>
  </svg>

  <svg width="180" height="180" style="position:absolute; right:120px; top:180px;" aria-hidden="true">
    <circle cx="90" cy="90" r="80" stroke="#2a9d8f" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="90" cy="90" r="50" stroke="#2a9d8f" stroke-width="1" fill="none" opacity="0.4"/>
  </svg>

  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#e9c46a"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#264653" font-family="Times New Roman">27</text>
  </svg>

</div>
</body>
</html>
