<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 695" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Жизненный цикл выбора: заказ накануне, изменение у линии, выдача; ветви — получил, срыв, отказ от блюда с заменой, отказ от еды с эскалацией к врачу; журналы заказа, срывов, замен и отказов сводятся в статистику выбора и пересчёт объёмов и меню">
<title>Жизненный цикл выбора: заказ накануне, изменение у линии, выдача; ветви — получил, срыв, отказ от блюда с заменой, отказ от еды с эскалацией к врачу; журналы заказа, срывов, замен и отказов сводятся в статистику выбора и пересчёт объёмов и меню</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="695" fill="#ffffff"/>
<rect x="34.0" y="10.0" width="194.0" height="102.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="44.0" y="30.4" font-size="13" font-weight="600" fill="#1d2a2e">Заказ накануне</text><text x="44.0" y="50.6" font-size="12" fill="#1d2a2e">Журнал заказа</text><text x="44.0" y="66.6" font-size="12" fill="#1d2a2e">(приложение 7):</text><text x="44.0" y="82.6" font-size="12" fill="#1d2a2e">вчерашний выбор задаёт</text><text x="44.0" y="98.6" font-size="12" fill="#1d2a2e">сегодняшнюю варку</text>
<line x1="231.0" y1="61.0" x2="251.0" y2="61.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="254.0" y="10.0" width="194.0" height="102.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="264.0" y="30.4" font-size="13" font-weight="600" fill="#1d2a2e">Изменение у линии</text><text x="264.0" y="50.6" font-size="12" fill="#1d2a2e">Заказ — прогноз, а не</text><text x="264.0" y="66.6" font-size="12" fill="#1d2a2e">приговор: резерв в</text><text x="264.0" y="82.6" font-size="12" fill="#1d2a2e">каждом варианте</text>
<line x1="451.0" y1="61.0" x2="471.0" y2="61.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="474.0" y="10.0" width="194.0" height="102.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="484.0" y="30.4" font-size="13" font-weight="600" fill="#1d2a2e">Выдача</text><text x="484.0" y="50.6" font-size="12" fill="#1d2a2e">Житель получает</text><text x="484.0" y="66.6" font-size="12" fill="#1d2a2e">тарелку — или нет</text>
<rect x="34.0" y="142.0" width="151.0" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="44.0" y="161.6" font-size="12" font-weight="600" fill="#1d2a2e">Получил</text><text x="44.0" y="177.6" font-size="12" font-weight="600" fill="#1d2a2e">выбранное</text><text x="44.0" y="196.8" font-size="11" fill="#1d2a2e">Строка в журнале</text><text x="44.0" y="210.8" font-size="11" fill="#1d2a2e">заказа</text>
<path d="M571.0,114.0 L571.0,124.0 L109.5,124.0 L109.5,139.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="195.0" y="142.0" width="151.0" height="93.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/><text x="205.0" y="161.6" font-size="12" font-weight="600" fill="#1d2a2e">Срыв выбора</text><text x="205.0" y="180.8" font-size="11" fill="#1d2a2e">Закончилось, не</text><text x="205.0" y="194.8" font-size="11" fill="#1d2a2e">привезли, не</text><text x="205.0" y="208.8" font-size="11" fill="#1d2a2e">приготовили,</text><text x="205.0" y="222.8" font-size="11" fill="#1d2a2e">перепутали варианты</text>
<path d="M571.0,114.0 L571.0,124.0 L270.5,124.0 L270.5,139.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="356.0" y="142.0" width="151.0" height="93.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/><text x="366.0" y="161.6" font-size="12" font-weight="600" fill="#1d2a2e">Отказ от блюда</text><text x="366.0" y="180.8" font-size="11" fill="#1d2a2e">Предложена замена;</text><text x="366.0" y="194.8" font-size="11" fill="#1d2a2e">записано, принял ли</text><text x="366.0" y="208.8" font-size="11" fill="#1d2a2e">её житель</text>
<path d="M571.0,114.0 L571.0,124.0 L431.5,124.0 L431.5,139.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="517.0" y="142.0" width="151.0" height="93.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="527.0" y="161.6" font-size="12" font-weight="600" fill="#1d2a2e">Отказ от еды</text><text x="527.0" y="180.8" font-size="11" fill="#1d2a2e">Целиком или бо́льшая</text><text x="527.0" y="194.8" font-size="11" fill="#1d2a2e">часть приёма, отказ</text><text x="527.0" y="208.8" font-size="11" fill="#1d2a2e">от питья —</text><text x="527.0" y="222.8" font-size="11" fill="#1d2a2e">возможный симптом</text>
<path d="M571.0,114.0 L571.0,124.0 L592.5,124.0 L592.5,139.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<rect x="34.0" y="257.0" width="151.0" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="44.0" y="276.6" font-size="12" font-weight="600" fill="#1d2a2e">Журнал заказа</text><text x="44.0" y="295.8" font-size="11" fill="#1d2a2e">приложение 7 ·</text><text x="44.0" y="309.8" font-size="11" fill="#1d2a2e">горизонт — сутки ·</text><text x="44.0" y="323.8" font-size="11" fill="#1d2a2e">раздача и кухня</text>
<line x1="109.5" y1="238.0" x2="109.5" y2="254.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="195.0" y="257.0" width="151.0" height="93.0" rx="6" fill="#ffffff" stroke="#c08a2d" stroke-width="1.5"/><text x="205.0" y="276.6" font-size="12" font-weight="600" fill="#1d2a2e">Журнал срывов</text><text x="205.0" y="295.8" font-size="11" fill="#1d2a2e">приложение 8 · в</text><text x="205.0" y="309.8" font-size="11" fill="#1d2a2e">день срыва · разбор</text><text x="205.0" y="323.8" font-size="11" fill="#1d2a2e">на еженедельной</text><text x="205.0" y="337.8" font-size="11" fill="#1d2a2e">планёрке</text>
<line x1="270.5" y1="238.0" x2="270.5" y2="254.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="356.0" y="257.0" width="151.0" height="93.0" rx="6" fill="#ffffff" stroke="#c08a2d" stroke-width="1.5"/><text x="366.0" y="276.6" font-size="12" font-weight="600" fill="#1d2a2e">Журнал замен</text><text x="366.0" y="295.8" font-size="11" fill="#1d2a2e">раздел 19.8 · в день</text><text x="366.0" y="309.8" font-size="11" fill="#1d2a2e">события · раз в месяц</text><text x="366.0" y="323.8" font-size="11" fill="#1d2a2e">читают вместе с</text><text x="366.0" y="337.8" font-size="11" fill="#1d2a2e">журналом срывов</text>
<line x1="431.5" y1="238.0" x2="431.5" y2="254.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="517.0" y="257.0" width="151.0" height="93.0" rx="6" fill="#ffffff" stroke="#a63d32" stroke-width="1.5"/><text x="527.0" y="276.6" font-size="12" font-weight="600" fill="#1d2a2e">Журнал отказов</text><text x="527.0" y="295.8" font-size="11" fill="#1d2a2e">приложение 9 · ведёт</text><text x="527.0" y="309.8" font-size="11" fill="#1d2a2e">смена · врач читает</text><text x="527.0" y="323.8" font-size="11" fill="#1d2a2e">еженедельно</text>
<line x1="592.5" y1="238.0" x2="592.5" y2="254.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="517.0" y="360.0" width="151.0" height="105.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="527.0" y="378.8" font-size="11" font-weight="600" fill="#1d2a2e">Три отказа</text><text x="527.0" y="392.8" font-size="11" font-weight="600" fill="#1d2a2e">подряд — врач в</text><text x="527.0" y="406.8" font-size="11" font-weight="600" fill="#1d2a2e">тот же день</text><text x="527.0" y="424.8" font-size="11" fill="#1d2a2e">Решает врач; эпизод</text><text x="527.0" y="438.8" font-size="11" fill="#1d2a2e">закрывается его</text><text x="527.0" y="452.8" font-size="11" fill="#1d2a2e">записью</text>
<line x1="592.5" y1="353.0" x2="592.5" y2="357.0" stroke="#a63d32" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="195.0" y="360.0" width="312.0" height="77.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="205.0" y="378.8" font-size="11" font-weight="600" fill="#1d2a2e">Перепутанные порции разной текстуры — не</text><text x="205.0" y="392.8" font-size="11" font-weight="600" fill="#1d2a2e">срыв</text><text x="205.0" y="410.8" font-size="11" fill="#1d2a2e">Это клинический инцидент: врач и протокол</text><text x="205.0" y="424.8" font-size="11" fill="#1d2a2e">разбора (приложение 34)</text>
<rect x="34.0" y="487.0" width="634.0" height="70.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="44.0" y="507.4" font-size="13" font-weight="600" fill="#1d2a2e">Статистика выбора: свод всех журналов за месяц (диетсестра и руководитель)</text><text x="44.0" y="527.6" font-size="12" fill="#1d2a2e">Доли вариантов А и Б по позициям и неделям, блюда — лидеры остатков, доля «выбрал Б — не</text><text x="44.0" y="543.6" font-size="12" fill="#1d2a2e">получил Б» (строка 10 панели, раздел 22.4)</text>
<line x1="109.5" y1="353.0" x2="109.5" y2="484.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="34.0" y="579.0" width="311.0" height="102.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="44.0" y="599.4" font-size="13" font-weight="600" fill="#1d2a2e">Каждые две недели — объёмы</text><text x="44.0" y="619.6" font-size="12" fill="#1d2a2e">Доли выбора корректируют варку: сколько</text><text x="44.0" y="635.6" font-size="12" fill="#1d2a2e">готовить А и сколько Б</text>
<line x1="189.5" y1="560.0" x2="189.5" y2="576.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="357.0" y="579.0" width="311.0" height="102.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="367.0" y="599.4" font-size="13" font-weight="600" fill="#1d2a2e">Каждый цикл — меню и пары</text><text x="367.0" y="619.6" font-size="12" fill="#1d2a2e">Устойчиво ниже 15 % — кандидат на замену;</text><text x="367.0" y="635.6" font-size="12" fill="#1d2a2e">дважды за цикл кончается раньше третьего</text><text x="367.0" y="651.6" font-size="12" fill="#1d2a2e">отделения — увеличить долю; резерв 10 %</text><text x="367.0" y="667.6" font-size="12" fill="#1d2a2e">на вариант Б</text>
<line x1="512.5" y1="560.0" x2="512.5" y2="576.0" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M34.0,630.0 L14.0,630.0 L14.0,61.0 L31.0,61.0" stroke="#1f6f6a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<text transform="translate(26,345.5) rotate(-90)" font-size="11" fill="#5b6b73" text-anchor="middle">цикл пересчёта повторяют: предпочтения сдвигаются (раздел 21.9)</text>
</svg>
