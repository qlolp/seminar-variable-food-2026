<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 715" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Из чего складывается стоимость питания и цена вариативности: три стоимости (сырьё, полная стоимость, кормление), четыре составляющие цены выбора при моделях М1–М2 и четыре листа калькулятора приложения 42">
<title>Из чего складывается стоимость питания и цена вариативности: три стоимости (сырьё, полная стоимость, кормление), четыре составляющие цены выбора при моделях М1–М2 и четыре листа калькулятора приложения 42</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="715" fill="#ffffff"/>
<text x="12.0" y="22.0" font-size="12" font-weight="600" fill="#5b6b73">Три стоимости питания, которые путают (раздел 29.2)</text>
<text x="12.0" y="44.0" font-size="11.5" fill="#1d2a2e">Аудит Онтарио, долларов на жителя в день: сырьё 9,54 из 25,31 полной стоимости</text>
<rect x="12.0" y="54.0" width="247.3" height="46.0" rx="6" fill="#1f6f6a"/>
<rect x="261.3" y="54.0" width="406.7" height="46.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="22.0" y="74.0" font-size="13" font-weight="600" fill="#ffffff">Сырьевая строка</text>
<text x="22.0" y="91.0" font-size="11.5" fill="#ffffff">продукты: 9,54</text>
<text x="271.3" y="74.0" font-size="13" font-weight="600" fill="#1d2a2e">Полная стоимость: 25,31</text>
<text x="271.3" y="91.0" font-size="11.5" fill="#1d2a2e">+ труд кухни, энергия, оборудование, амортизация</text>
<text x="12.0" y="118.0" font-size="11.5" fill="#1d2a2e">По канадскому руководству полная стоимость в 3–6 раз выше сырьевой строки.</text>
<rect x="12.0" y="130.0" width="656.0" height="67.0" rx="6" fill="#ffffff" stroke="#a63d32" stroke-width="1.5" stroke-dasharray="5 3"/><text x="22.0" y="150.0" font-size="12.5" font-weight="600" fill="#a63d32">Стоимость кормления — самая дорогая и самая скрытая строка</text><text x="22.0" y="169.2" font-size="11.5" fill="#1d2a2e">Время помощников за столом: до 45 минут в день на жителя, которому нужна помощь (канадские</text><text x="22.0" y="184.2" font-size="11.5" fill="#1d2a2e">данные). Живёт в штатном расписании, а не в продуктовом бюджете (разделы 28.3, 28.11).</text>
<text x="12.0" y="214.0" font-size="11" font-style="italic" fill="#5b6b73">Зарубежные суммы показывают механизм, а не норматив для России: свою строку дом считает сам (раздел 29.3).</text>
<text x="12.0" y="245.0" font-size="12" font-weight="600" fill="#5b6b73">Из чего складывается цена выбора при М1–М2 и парах эквивалентов (раздел 29.4)</text>
<rect x="12.0" y="255.0" width="158.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="275.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Сырьё: около нуля</text><text x="22.0" y="293.8" font-size="11" fill="#1d2a2e">Не добавляется, а</text><text x="22.0" y="307.8" font-size="11" fill="#1d2a2e">перераспределяется</text><text x="22.0" y="321.8" font-size="11" fill="#1d2a2e">внутри той же строки:</text><text x="22.0" y="335.8" font-size="11" fill="#1d2a2e">гречка или рис —</text><text x="22.0" y="349.8" font-size="11" fill="#1d2a2e">расход круп прежний,</text><text x="22.0" y="363.8" font-size="11" fill="#1d2a2e">меняется пропорция</text>
<rect x="178.0" y="255.0" width="158.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="188.0" y="275.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Труд: минуты</text><text x="188.0" y="293.8" font-size="11" fill="#1d2a2e">Время раздачи и учёта</text><text x="188.0" y="307.8" font-size="11" fill="#1d2a2e">на линии; повар —</text><text x="188.0" y="321.8" font-size="11" fill="#1d2a2e">10–20 минут на партию</text><text x="188.0" y="335.8" font-size="11" fill="#1d2a2e">второго варианта;</text><text x="188.0" y="349.8" font-size="11" fill="#1d2a2e">диетсестра —</text><text x="188.0" y="363.8" font-size="11" fill="#1d2a2e">4–8 часов раз в</text><text x="188.0" y="377.8" font-size="11" fill="#1d2a2e">квартал; врач —</text><text x="188.0" y="391.8" font-size="11" fill="#1d2a2e">диетические столы</text>
<rect x="344.0" y="255.0" width="158.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="354.0" y="275.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Разовые затраты</text><text x="354.0" y="293.8" font-size="11" fill="#1d2a2e">Вторая гастроёмкость,</text><text x="354.0" y="307.8" font-size="11" fill="#1d2a2e">маркеры, визуальное</text><text x="354.0" y="321.8" font-size="11" fill="#1d2a2e">меню</text>
<rect x="510.0" y="255.0" width="158.0" height="163.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/><text x="520.0" y="275.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Ошибка прогноза</text><text x="520.0" y="293.8" font-size="11" fill="#1d2a2e">Излишек одного</text><text x="520.0" y="307.8" font-size="11" fill="#1d2a2e">варианта уходит в бак,</text><text x="520.0" y="321.8" font-size="11" fill="#1d2a2e">нехватка</text><text x="520.0" y="335.8" font-size="11" fill="#1d2a2e">оборачивается</text><text x="520.0" y="349.8" font-size="11" fill="#1d2a2e">заменой и</text><text x="520.0" y="363.8" font-size="11" fill="#1d2a2e">недовольством; цену</text><text x="520.0" y="377.8" font-size="11" fill="#1d2a2e">ошибки снижает</text><text x="520.0" y="391.8" font-size="11" fill="#1d2a2e">только журнал заказа</text><text x="520.0" y="405.8" font-size="11" fill="#1d2a2e">(раздел 21)</text>
<text x="12.0" y="437.0" font-size="11" font-style="italic" fill="#5b6b73">Модельные оценки, не замеры: фактическую цену даёт семидневный замер до старта и через 90 дней.</text>
<text x="12.0" y="468.0" font-size="12" font-weight="600" fill="#5b6b73">Калькулятор стоимости вариативности: четыре листа (приложение 42)</text>
<rect x="12.0" y="478.0" width="147.5" height="123.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="497.6" font-size="12" font-weight="600" fill="#1d2a2e">Лист 1. Пары</text><text x="22.0" y="513.6" font-size="12" font-weight="600" fill="#1d2a2e">блюд</text><text x="22.0" y="532.8" font-size="11" fill="#1d2a2e">Закладка, г × цена,</text><text x="22.0" y="546.8" font-size="11" fill="#1d2a2e">руб./кг ÷ 1000 =</text><text x="22.0" y="560.8" font-size="11" fill="#1d2a2e">стоимость порции;</text><text x="22.0" y="574.8" font-size="11" fill="#1d2a2e">разница А и Б в</text><text x="22.0" y="588.8" font-size="11" fill="#1d2a2e">месяц</text>
<line x1="162.5" y1="539.5" x2="178.5" y2="539.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="181.5" y="478.0" width="147.5" height="123.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="191.5" y="497.6" font-size="12" font-weight="600" fill="#1d2a2e">Лист 2. Отходы</text><text x="191.5" y="516.8" font-size="11" fill="#1d2a2e">Остатки, г на порцию</text><text x="191.5" y="530.8" font-size="11" fill="#1d2a2e">× число порций ×</text><text x="191.5" y="544.8" font-size="11" fill="#1d2a2e">цена; кухонные и</text><text x="191.5" y="558.8" font-size="11" fill="#1d2a2e">тарелочные —</text><text x="191.5" y="572.8" font-size="11" fill="#1d2a2e">раздельно</text>
<line x1="332.0" y1="539.5" x2="348.0" y2="539.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="351.0" y="478.0" width="147.5" height="123.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="361.0" y="497.6" font-size="12" font-weight="600" fill="#1d2a2e">Лист 3. Сценарии</text><text x="361.0" y="516.8" font-size="11" fill="#1d2a2e">Снижение отходов</text><text x="361.0" y="530.8" font-size="11" fill="#1d2a2e">на 10, 20, 30 % —</text><text x="361.0" y="544.8" font-size="11" fill="#1d2a2e">гипотеза, а не</text><text x="361.0" y="558.8" font-size="11" fill="#1d2a2e">прогноз</text>
<line x1="501.5" y1="539.5" x2="517.5" y2="539.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520.5" y="478.0" width="147.5" height="123.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="530.5" y="497.6" font-size="12" font-weight="600" fill="#1d2a2e">Лист 4. Два</text><text x="530.5" y="513.6" font-size="12" font-weight="600" fill="#1d2a2e">сценария</text><text x="530.5" y="532.8" font-size="11" fill="#1d2a2e">Собственный</text><text x="530.5" y="546.8" font-size="11" fill="#1d2a2e">пищеблок или</text><text x="530.5" y="560.8" font-size="11" fill="#1d2a2e">аутсорсинг: две</text><text x="530.5" y="574.8" font-size="11" fill="#1d2a2e">позиции в задании</text><text x="530.5" y="588.8" font-size="11" fill="#1d2a2e">(приложение 43)</text>
<line x1="340.0" y1="604.0" x2="340.0" y2="620.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="12.0" y="623.0" width="656.0" height="82.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/><text x="22.0" y="643.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Замер до и после — обязателен: калькулятор считает гипотезу, а не доказывает её</text><text x="22.0" y="662.2" font-size="11.5" fill="#1d2a2e">Отходы, г × цена килограмма по фактуре = рубли в бак. Снижение отходов подтверждает только</text><text x="22.0" y="677.2" font-size="11.5" fill="#1d2a2e">повторный замер через 90 дней (приложение 25). С этими строками — разговор с учредителем</text><text x="22.0" y="692.2" font-size="11.5" fill="#1d2a2e">(раздел 29.9).</text>
</svg>
