<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 786" font-family="Inter, 'DejaVu Sans', sans-serif" fill="#1d2a2e" role="img">
<title>Переход на СанПиН 2.3/2.4.4282-26 и санитарный контроль на раздаче</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b73"/></marker></defs>
<rect width="680" height="786" fill="#ffffff"/>
<rect x="0" y="0" width="170" height="58" rx="6" fill="#f4f6f7" stroke="#5b6b73" stroke-width="1.5"/>
<text x="10" y="20" font-size="13" font-weight="600" fill="#5b6b73">До 31.08.2026</text>
<text x="10" y="37" font-size="11.5" fill="#5b6b73">СанПиН 2.3/2.4.3590-20</text>
<text x="10" y="51" font-size="11" fill="#5b6b73">постановление № 32</text>
<rect x="214" y="0" width="466" height="58" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="226" y="20" font-size="13" font-weight="600" fill="#1f6f6a">С 01.09.2026 — СанПиН 2.3/2.4.4282-26</text>
<text x="226" y="37" font-size="11.5">постановление № 18; действует до 01.09.2032</text>
<text x="226" y="51" font-size="11" fill="#5b6b73">старые правила утратили силу без переходного периода</text>
<rect x="0" y="68" width="170" height="44" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
<text x="85" y="95" font-size="12.5" font-weight="600" fill="#5b6b73" text-anchor="middle">п. 7.1.11</text>
<line x1="172" y1="90" x2="212" y2="90" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="214" y="68" width="466" height="44" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="226" y="95" font-size="12.5" font-weight="600" fill="#1f6f6a">п. 56 подп. 11</text>
<text x="330" y="87" font-size="11.5">Питание не реже трёх раз в день, в том числе</text>
<text x="330" y="102" font-size="11.5">диетическое (лечебное) по медицинским показаниям</text>
<rect x="0" y="120" width="170" height="44" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
<text x="85" y="147" font-size="12.5" font-weight="600" fill="#5b6b73" text-anchor="middle">п. 7.1.12</text>
<line x1="172" y1="142" x2="212" y2="142" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="214" y="120" width="466" height="44" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="226" y="147" font-size="12.5" font-weight="600" fill="#1f6f6a">п. 56 подп. 12</text>
<text x="330" y="139" font-size="11.5">Готовые блюда со стороны: помещение для приёма</text>
<text x="330" y="154" font-size="11.5">продукции и отбора суточных проб</text>
<rect x="0" y="172" width="170" height="44" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
<text x="85" y="199" font-size="12.5" font-weight="600" fill="#5b6b73" text-anchor="middle">п. 7.1.13</text>
<line x1="172" y1="194" x2="212" y2="194" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="214" y="172" width="466" height="44" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="226" y="199" font-size="12.5" font-weight="600" fill="#1f6f6a">п. 56 подп. 13</text>
<text x="330" y="191" font-size="11.5">Блюдо с нарушением технологии не выдаётся</text>
<text x="330" y="206" font-size="11.5">до устранения; запись в журнал бракеража</text>
<rect x="0" y="224" width="170" height="44" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
<text x="85" y="251" font-size="12.5" font-weight="600" fill="#5b6b73" text-anchor="middle">п. 7.1.14</text>
<line x1="172" y1="246" x2="212" y2="246" stroke="#5b6b73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="214" y="224" width="466" height="44" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="226" y="251" font-size="12.5" font-weight="600" fill="#1f6f6a">п. 56 подп. 14</text>
<text x="330" y="243" font-size="11.5">Требования распространяются на привлекаемые</text>
<text x="330" y="258" font-size="11.5">предприятия общественного питания</text>
<rect x="0" y="280" width="250" height="124" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="12" y="301" font-size="13" font-weight="600" fill="#1f6f6a">Не меняется</text>
<text x="12" y="321" font-size="11.5">Ни одна редакция не ограничивает</text>
<text x="12" y="336" font-size="11.5">число вариантов блюда. Модель</text>
<text x="12" y="351" font-size="11.5">выбора — пары, замены, журнал</text>
<text x="12" y="366" font-size="11.5">заказа — остаётся той же; каждый</text>
<text x="12" y="381" font-size="11.5">вариант проходит весь контур.</text>
<rect x="262" y="280" width="418" height="124" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="274" y="301" font-size="13" font-weight="600" fill="#c08a2d">Что сделать к 1 сентября</text>
<text x="274" y="321" font-size="11.5">• Журналы до 31.08 не переписывать: это выглядит как подлог.</text>
<text x="274" y="336" font-size="11.5">• С 01.09 — новые формы; журнал бракеража по образцам</text>
<text x="285" y="351" font-size="11.5">приложений 4 и 5 к новым правилам.</text>
<text x="274" y="366" font-size="11.5">• Программу производственного контроля, инструкции</text>
<text x="285" y="381" font-size="11.5">и чек-листы перепривязать к новым пунктам (приложение 39).</text>
<line x1="0" y1="416" x2="680" y2="416" stroke="#c9d1d4" stroke-width="1.5"/>
<text x="0" y="438" font-size="13.5" font-weight="600">На раздаче проверяют каждый вариант — и А, и Б</text>
<rect x="0" y="448" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="12" y="468" font-size="12.5" font-weight="600" fill="#1f6f6a">Суточная проба</text>
<text x="323" y="468" font-size="11" fill="#5b6b73" text-anchor="end">подп. 4 п. 56</text>
<text x="12" y="487" font-size="11.5">Отдельно от каждого варианта, в</text>
<text x="12" y="502" font-size="11.5">промаркированной ёмкости; хранится</text>
<text x="12" y="517" font-size="11.5">не менее 48 часов при +2…+6 °C</text>
<rect x="345" y="448" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="357" y="468" font-size="12.5" font-weight="600" fill="#1f6f6a">Температура</text>
<text x="668" y="468" font-size="11" fill="#5b6b73" text-anchor="end">п. 50</text>
<text x="357" y="487" font-size="11.5">По технологическим картам: в обеих</text>
<text x="357" y="502" font-size="11.5">гастроёмкостях и на последнем столе;</text>
<text x="357" y="517" font-size="11.5">при раздаче в комнаты — в палате</text>
<rect x="0" y="534" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="12" y="554" font-size="12.5" font-weight="600" fill="#1f6f6a">Время на раздаче</text>
<text x="323" y="554" font-size="11" fill="#5b6b73" text-anchor="end">п. 32</text>
<text x="12" y="573" font-size="11.5">Блюда, требующие разогрева, — не</text>
<text x="12" y="588" font-size="11.5">более трёх часов с изготовления.</text>
<text x="12" y="603" font-size="11.5">Вариант Б — в малых гастроёмкостях</text>
<rect x="345" y="534" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="357" y="554" font-size="12.5" font-weight="600" fill="#1f6f6a">Бракераж</text>
<text x="668" y="554" font-size="11" fill="#5b6b73" text-anchor="end">подп. 13 п. 56</text>
<text x="357" y="573" font-size="11.5">До выдачи, с записью в журнал;</text>
<text x="357" y="588" font-size="11.5">брак не выдаётся, пока недостатки</text>
<text x="357" y="603" font-size="11.5">не устранены</text>
<rect x="0" y="620" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="12" y="640" font-size="12.5" font-weight="600" fill="#1f6f6a">Кто раздаёт</text>
<text x="323" y="640" font-size="11" fill="#5b6b73" text-anchor="end">п. 32</text>
<text x="12" y="659" font-size="11.5">Посторонние к раздаче не допускаются:</text>
<text x="12" y="674" font-size="11.5">раздача должна быть в должностной</text>
<text x="12" y="689" font-size="11.5">инструкции санитарки или помощника</text>
<rect x="345" y="620" width="335" height="78" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="357" y="640" font-size="12.5" font-weight="600" fill="#1f6f6a">Остатки</text>
<text x="668" y="640" font-size="11" fill="#5b6b73" text-anchor="end">п. 32</text>
<text x="357" y="659" font-size="11.5">Не реализуют на следующий день</text>
<text x="357" y="674" font-size="11.5">и не замораживают впрок —</text>
<text x="357" y="689" font-size="11.5">одинаково для обоих вариантов</text>
<rect x="0" y="706" width="335" height="78" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="12" y="726" font-size="12.5" font-weight="600" fill="#c08a2d">Маркировка «вариант А / Б»</text>
<text x="323" y="726" font-size="11" fill="#5b6b73" text-anchor="end">рекомендация</text>
<text x="12" y="745" font-size="11.5">Прямой нормы для линии нет (п. 55 —</text>
<text x="12" y="760" font-size="11.5">для кейтеринга), но безымянная</text>
<text x="12" y="775" font-size="11.5">кастрюля — типовое замечание</text>
<rect x="345" y="706" width="335" height="78" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="357" y="726" font-size="12.5" font-weight="600" fill="#c08a2d">Журналы</text>
<text x="668" y="726" font-size="11" fill="#5b6b73" text-anchor="end">рекомендация</text>
<text x="357" y="745" font-size="11.5">Те же санитарные журналы для обоих</text>
<text x="357" y="760" font-size="11.5">вариантов, без отдельной</text>
<text x="357" y="775" font-size="11.5">«вариативной бухгалтерии»</text>
</svg>
