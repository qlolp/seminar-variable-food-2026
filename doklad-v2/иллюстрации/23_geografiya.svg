<text x="352.0" y="23.0" font-size="13" font-weight="600" fill="#1d2a2e">Жители взрослых ПНИ, тыс. человек</text><text x="352.0" y="40.0" font-size="11" fill="#5b6b73">максимум 2018 года; за 2023 год — минус 26 тыс. (16 %)</text><line x1="386.0" y1="176.0" x2="668.0" y2="176.0" stroke="#5b6b73" stroke-width="1"/><text x="380.0" y="180.0" font-size="11" text-anchor="end" fill="#5b6b73">0</text><line x1="386.0" y1="136.0" x2="668.0" y2="136.0" stroke="#c9d1d4" stroke-width="1"/><text x="380.0" y="140.0" font-size="11" text-anchor="end" fill="#5b6b73">60</text><line x1="386.0" y1="96.0" x2="668.0" y2="96.0" stroke="#c9d1d4" stroke-width="1"/><text x="380.0" y="100.0" font-size="11" text-anchor="end" fill="#5b6b73">120</text><line x1="386.0" y1="56.0" x2="668.0" y2="56.0" stroke="#c9d1d4" stroke-width="1"/><text x="380.0" y="60.0" font-size="11" text-anchor="end" fill="#5b6b73">180</text><path d="M434.5,176.0 V73.3 Q434.5,69.3 438.5,69.3 H474.5 Q478.5,69.3 478.5,73.3 V176.0 Z" fill="#1f6f6a"/><text x="456.5" y="62.3" font-size="12" font-weight="600" text-anchor="middle" fill="#1d2a2e">≈ 160–161</text><text x="456.5" y="192.0" font-size="12" text-anchor="middle" fill="#1d2a2e">2018</text><path d="M575.5,176.0 V87.0 Q575.5,83.0 579.5,83.0 H615.5 Q619.5,83.0 619.5,87.0 V176.0 Z" fill="#1f6f6a"/><text x="597.5" y="76.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d2a2e">≈ 139,5</text><text x="597.5" y="192.0" font-size="12" text-anchor="middle" fill="#1d2a2e">2024</text>
<text x="12.0" y="233.0" font-size="13" font-weight="600" fill="#1d2a2e">Кто живёт в интернатах — доли 2022 года, %</text>
<line x1="242.0" y1="240.0" x2="242.0" y2="336.0" stroke="#5b6b73" stroke-width="1"/>
<rect x="242.0" y="244.0" width="382.0" height="16.0" rx="3" fill="#eef1f2"/>
<rect x="242.0" y="244.0" width="248.3" height="16.0" rx="3" fill="#1f6f6a"/>
<text x="234.0" y="256.5" font-size="12" text-anchor="end" fill="#1d2a2e">старше 45 лет</text>
<text x="496.3" y="256.5" font-size="12" font-weight="600" fill="#1d2a2e">65</text>
<rect x="242.0" y="274.0" width="382.0" height="16.0" rx="3" fill="#eef1f2"/>
<rect x="242.0" y="274.0" width="282.7" height="16.0" rx="3" fill="#1f6f6a"/>
<text x="234.0" y="286.5" font-size="12" text-anchor="end" fill="#1d2a2e">признаны недееспособными</text>
<text x="530.7" y="286.5" font-size="12" font-weight="600" fill="#1d2a2e">74</text>
<rect x="242.0" y="304.0" width="382.0" height="16.0" rx="3" fill="#eef1f2"/>
<rect x="242.0" y="304.0" width="42.0" height="16.0" rx="3" fill="#1f6f6a"/>
<text x="234.0" y="316.5" font-size="12" text-anchor="end" fill="#1d2a2e">на постоянном постельном режиме</text>
<text x="290.0" y="316.5" font-size="12" font-weight="600" fill="#1d2a2e">11</text>
<line x1="406.3" y1="241.0" x2="406.3" y2="263.0" stroke="#a63d32" stroke-width="2"/>
<line x1="246.0" y1="340.0" x2="258.0" y2="340.0" stroke="#a63d32" stroke-width="2"/>
<text x="264.0" y="344.0" font-size="11" fill="#5b6b73">среди населения России в целом старше 45 лет — 43 %</text>
<text x="12.0" y="373.0" font-size="13" font-weight="600" fill="#1d2a2e">Группа инвалидности жителей, %</text>
<rect x="12.0" y="382.0" width="417.8" height="26.0" rx="3" fill="#1f6f6a"/>
<text x="220.9" y="399.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">II группа — 64</text>
<rect x="431.8" y="382.0" width="201.4" height="26.0" rx="3" fill="#c08a2d"/>
<text x="532.5" y="399.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">I группа — 31</text>
<rect x="635.2" y="382.0" width="30.8" height="26.0" rx="3" fill="#5b6b73"/>
<text x="650.6" y="399.5" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">5</text>
<text x="668.0" y="426.0" font-size="11" text-anchor="end" fill="#5b6b73">III группа — 5 %</text>
<text x="12.0" y="453.0" font-size="13" font-weight="600" fill="#1d2a2e">Масштаб и выход из интернатов</text>
<rect x="12.0" y="462.0" width="156.5" height="140.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="22.0" y="488.0" font-size="20" font-weight="600" fill="#1d2a2e">289</text>
<text x="22.0" y="506.0" font-size="11" fill="#1d2a2e">мест в среднем ПНИ;</text><text x="22.0" y="520.0" font-size="11" fill="#1d2a2e">оптимальным</text><text x="22.0" y="534.0" font-size="11" fill="#1d2a2e">эксперты считают</text><text x="22.0" y="548.0" font-size="11" fill="#1d2a2e">20–50 жителей</text>
<rect x="178.5" y="462.0" width="156.5" height="140.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="188.5" y="488.0" font-size="20" font-weight="600" fill="#1d2a2e">≈ 7 000</text>
<text x="188.5" y="506.0" font-size="11" fill="#1d2a2e">человек на</text><text x="188.5" y="520.0" font-size="11" fill="#1d2a2e">сопровождаемом</text><text x="188.5" y="534.0" font-size="11" fill="#1d2a2e">проживании в</text><text x="188.5" y="548.0" font-size="11" fill="#1d2a2e">2024 году — менее 5 %</text><text x="188.5" y="562.0" font-size="11" fill="#1d2a2e">числа подопечных ПНИ</text>
<rect x="345.0" y="462.0" width="156.5" height="140.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="355.0" y="488.0" font-size="20" font-weight="600" fill="#1d2a2e">≤ 1 800</text>
<text x="355.0" y="506.0" font-size="11" fill="#1d2a2e">получают постоянное</text><text x="355.0" y="520.0" font-size="11" fill="#1d2a2e">сопровождаемое</text><text x="355.0" y="534.0" font-size="11" fill="#1d2a2e">проживание (214</text><text x="355.0" y="548.0" font-size="11" fill="#1d2a2e">квартир, оценка</text><text x="355.0" y="562.0" font-size="11" fill="#1d2a2e">авторов)</text>
<rect x="511.5" y="462.0" width="156.5" height="140.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="521.5" y="488.0" font-size="20" font-weight="600" fill="#1d2a2e">≈ 8 000</text>
<text x="521.5" y="506.0" font-size="11" fill="#1d2a2e">получателей услуг</text><text x="521.5" y="520.0" font-size="11" fill="#1d2a2e">сопровождаемого</text><text x="521.5" y="534.0" font-size="11" fill="#1d2a2e">проживания в</text><text x="521.5" y="548.0" font-size="11" fill="#1d2a2e">2025 году, из них</text><text x="521.5" y="562.0" font-size="11" fill="#1d2a2e">6 400 — с</text><text x="521.5" y="576.0" font-size="11" fill="#1d2a2e">психическими</text><text x="521.5" y="590.0" font-size="11" fill="#1d2a2e">расстройствами</text>
<text x="12.0" y="622.0" font-size="11" font-style="italic" fill="#5b6b73">Вторичная аналитика на государственных массивах, а не отчётность Минтруда; цифры — порядковые</text><text x="12.0" y="636.0" font-size="11" font-style="italic" fill="#5b6b73">ориентиры. Численность — 2024 год, доли состава жителей — 2022 год (раздел 23.2).</text>
