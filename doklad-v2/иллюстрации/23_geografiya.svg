<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 648" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Диаграммы по данным раздела 23.2: число взрослых ПНИ 540 в 2014, 536 в 2022 и 466 в 2024 году; жителей около 160–161 тысячи в 2018 и около 139,5 тысячи в 2024 году; в 2022 году 65 % жителей старше 45 лет против 43 % в населении, 74 % недееспособны, 11 % на постельном режиме; группы инвалидности II — 64 %, I — 31 %, III — 5 %; средний ПНИ на 289 мест, сопровождаемое проживание около 7 тысяч в 2024 и около 8 тысяч в 2025 году">
<title>Диаграммы по данным раздела 23.2: число взрослых ПНИ 540 в 2014, 536 в 2022 и 466 в 2024 году; жителей около 160–161 тысячи в 2018 и около 139,5 тысячи в 2024 году; в 2022 году 65 % жителей старше 45 лет против 43 % в населении, 74 % недееспособны, 11 % на постельном режиме; группы инвалидности II — 64 %, I — 31 %, III — 5 %; средний ПНИ на 289 мест, сопровождаемое проживание около 7 тысяч в 2024 и около 8 тысяч в 2025 году</title>
