<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 698" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Временная шкала пилота на девяносто дней: дни 1–14 подготовка и замер «до», дни 15–75 работа с еженедельными планёрками, дни 76–90 оценка и решение по светофору; внизу три стоп-сигнала">
<title>Временная шкала пилота на девяносто дней: дни 1–14 подготовка и замер «до», дни 15–75 работа с еженедельными планёрками, дни 76–90 оценка и решение по светофору; внизу три стоп-сигнала</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="698" fill="#ffffff"/>
<rect x="12.0" y="10.0" width="656.0" height="82.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="30.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Минимальная конфигурация — модель М1 (раздел 35.3)</text><text x="22.0" y="49.2" font-size="11.5" fill="#1d2a2e">Одно отделение на 20–35 жителей, одна смена-единомышленница, один приём пищи: два варианта</text><text x="22.0" y="64.2" font-size="11.5" fill="#1d2a2e">второго блюда на обед, два-три дня в неделю, заказ накануне или на линии. Стандартный вариант</text><text x="22.0" y="79.2" font-size="11.5" fill="#1d2a2e">гарантирован всегда.</text>
<text x="24.0" y="122.0" font-size="11" font-weight="600" fill="#1d2a2e">день 1: приказ о пилоте</text>
<line x1="20.0" y1="125.0" x2="20.0" y2="172.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="124.7" y="138.0" font-size="11" font-weight="600" fill="#1d2a2e">день 15: старт линии</text>
<line x1="120.7" y1="141.0" x2="120.7" y2="172.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="232.5" y="154.0" font-size="11" font-weight="600" fill="#1d2a2e">с дня 30: выводы</text>
<line x1="228.5" y1="157.0" x2="228.5" y2="172.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="656.0" y="122.0" font-size="11" font-weight="600" text-anchor="end" fill="#1d2a2e">день 90: решение на бумаге</text>
<line x1="660.0" y1="125.0" x2="660.0" y2="172.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="20.0" y="172.0" width="97.0" height="26.0" rx="4" fill="#e8ecee" stroke="#5b6b73" stroke-width="1.5"/>
<text x="68.5" y="189.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#5b6b73">Дни 1–14</text>
<rect x="117.2" y="172.0" width="438.5" height="26.0" rx="4" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="336.4" y="189.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f6f6a">Дни 15–75</text>
<rect x="555.8" y="172.0" width="104.2" height="26.0" rx="4" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="607.9" y="189.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c08a2d">Дни 76–90</text>
<circle cx="163.8" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="214.2" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="264.5" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="314.8" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="365.2" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="415.5" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="465.8" cy="206.0" r="3" fill="#1f6f6a"/>
<circle cx="516.2" cy="206.0" r="3" fill="#1f6f6a"/>
<text x="358.0" y="220.0" font-size="10.5" text-anchor="middle" fill="#1f6f6a">планёрка раз в неделю</text>
<path d="M120.7,166.0 L221.3,166.0" stroke="#c08a2d" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
<path d="M20.0,199.0 L113.5,199.0 L204.0,228.0 L12.0,228.0 z" fill="#c9d1d4" opacity="0.35"/>
<path d="M120.7,199.0 L552.1,199.0 L463.0,228.0 L213.0,228.0 z" fill="#c9d1d4" opacity="0.35"/>
<path d="M559.3,199.0 L660.0,199.0 L668.0,228.0 L472.0,228.0 z" fill="#c9d1d4" opacity="0.35"/>
<rect x="12.0" y="232.0" width="192.0" height="326.0" rx="6" fill="#f3f5f6" stroke="#5b6b73" stroke-width="1.5"/>
<text x="22.0" y="252.0" font-size="12.5" font-weight="600" fill="#5b6b73">Подготовка: на линии</text><text x="22.0" y="268.0" font-size="12.5" font-weight="600" fill="#5b6b73">ничего не меняется</text>
<rect x="20.0" y="280.0" width="176.0" height="144.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="28.0" y="297.2" font-size="11.5" font-weight="600" fill="#1d2a2e">Неделя 1</text><text x="28.0" y="315.8" font-size="11" fill="#1d2a2e">Приказ (приложение 28):</text><text x="28.0" y="329.8" font-size="11" fill="#1d2a2e">точка, сроки,</text><text x="28.0" y="343.8" font-size="11" fill="#1d2a2e">ответственные, критерии</text><text x="28.0" y="357.8" font-size="11" fill="#1d2a2e">успеха и остановки, дата</text><text x="28.0" y="371.8" font-size="11" fill="#1d2a2e">решения. Замер «до» —</text><text x="28.0" y="385.8" font-size="11" fill="#1d2a2e">семь дней: отходы, время</text><text x="28.0" y="399.8" font-size="11" fill="#1d2a2e">раздачи, отказы</text><text x="28.0" y="413.8" font-size="11" fill="#1d2a2e">(приложение 25)</text>
<rect x="20.0" y="430.0" width="176.0" height="116.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="28.0" y="447.2" font-size="11.5" font-weight="600" fill="#1d2a2e">Неделя 2</text><text x="28.0" y="465.8" font-size="11" fill="#1d2a2e">Опрос предпочтений</text><text x="28.0" y="479.8" font-size="11" fill="#1d2a2e">(приложение 36),</text><text x="28.0" y="493.8" font-size="11" fill="#1d2a2e">инструктаж смены, письмо</text><text x="28.0" y="507.8" font-size="11" fill="#1d2a2e">учредителю, папка</text><text x="28.0" y="521.8" font-size="11" fill="#1d2a2e">проверяющему</text><text x="28.0" y="535.8" font-size="11" fill="#1d2a2e">(раздел 32.6)</text>
<rect x="213.0" y="232.0" width="250.0" height="326.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="223.0" y="252.0" font-size="12.5" font-weight="600" fill="#1f6f6a">Работа пилота</text>
<rect x="221.0" y="264.0" width="234.0" height="74.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="229.0" y="281.2" font-size="11.5" font-weight="600" fill="#1d2a2e">С первого дня</text><text x="229.0" y="299.8" font-size="11" fill="#1d2a2e">Журналы заказа и замен; с 15-го</text><text x="229.0" y="313.8" font-size="11" fill="#1d2a2e">дня — проверка реальности по</text><text x="229.0" y="327.8" font-size="11" fill="#1d2a2e">приложению 24</text>
<rect x="221.0" y="344.0" width="234.0" height="88.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="229.0" y="361.2" font-size="11.5" font-weight="600" fill="#1d2a2e">Каждую неделю</text><text x="229.0" y="379.8" font-size="11" fill="#1d2a2e">Планёрка на 15 минут, замечания —</text><text x="229.0" y="393.8" font-size="11" fill="#1d2a2e">в три корзины: смена, кухня,</text><text x="229.0" y="407.8" font-size="11" fill="#1d2a2e">администрация. Третья корзина не</text><text x="229.0" y="421.8" font-size="11" fill="#1d2a2e">пустует дольше двух недель</text>
<rect x="221.0" y="438.0" width="234.0" height="88.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="229.0" y="455.2" font-size="11.5" font-weight="600" fill="#1d2a2e">График хода процесса</text><text x="229.0" y="473.8" font-size="11" fill="#1d2a2e">Около тринадцати недельных точек</text><text x="229.0" y="487.8" font-size="11" fill="#1d2a2e">и медиана: сдвиг — шесть точек</text><text x="229.0" y="501.8" font-size="11" fill="#1d2a2e">подряд по одну сторону, тренд —</text><text x="229.0" y="515.8" font-size="11" fill="#1d2a2e">пять подряд</text>
<rect x="472.0" y="232.0" width="196.0" height="326.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/>
<text x="482.0" y="252.0" font-size="12.5" font-weight="600" fill="#c08a2d">Оценка и решение</text>
<rect x="480.0" y="264.0" width="180.0" height="74.0" rx="6" fill="#ffffff" stroke="#c08a2d" stroke-width="1.5"/><text x="488.0" y="281.2" font-size="11.5" font-weight="600" fill="#1d2a2e">Двенадцать чисел</text><text x="488.0" y="299.8" font-size="11" fill="#1d2a2e">«После» против «до» по</text><text x="488.0" y="313.8" font-size="11" fill="#1d2a2e">панели (приложения 27,</text><text x="488.0" y="327.8" font-size="11" fill="#1d2a2e">35)</text>
<rect x="480.0" y="344.0" width="180.0" height="74.0" rx="6" fill="#ffffff" stroke="#c08a2d" stroke-width="1.5"/><text x="488.0" y="361.2" font-size="11.5" font-weight="600" fill="#1d2a2e">Совет жителей</text><text x="488.0" y="379.8" font-size="11" fill="#1d2a2e">Заслушивает итоги;</text><text x="488.0" y="393.8" font-size="11" fill="#1d2a2e">протокол — к отчёту</text><text x="488.0" y="407.8" font-size="11" fill="#1d2a2e">учредителю</text>
<text x="482.0" y="438.0" font-size="11" font-weight="600" fill="#1d2a2e">Решение — по светофору:</text>
<circle cx="490.0" cy="454.0" r="6" fill="#1f6f6a"/>
<text x="502.0" y="458.0" font-size="11" fill="#1d2a2e">расширить или закрепить</text>
<circle cx="490.0" cy="474.0" r="6" fill="#c08a2d"/>
<text x="502.0" y="478.0" font-size="11" fill="#1d2a2e">ещё 60 дней с</text><text x="502.0" y="492.0" font-size="11" fill="#1d2a2e">исправлением пар и</text><text x="502.0" y="506.0" font-size="11" fill="#1d2a2e">потока</text>
<circle cx="490.0" cy="522.0" r="6" fill="#a63d32"/>
<text x="502.0" y="526.0" font-size="11" fill="#1d2a2e">свернуть приказом с</text><text x="502.0" y="540.0" font-size="11" fill="#1d2a2e">причинами</text>
<rect x="12.0" y="570.0" width="656.0" height="67.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="22.0" y="590.0" font-size="12.5" font-weight="600" fill="#a63d32">Стоп в любой день — три сигнала (раздел 35.5)</text><text x="22.0" y="609.2" font-size="11.5" fill="#1d2a2e">Рост отказов от еды в точке пилота · санитарные нарушения на новой линии · клинические</text><text x="22.0" y="624.2" font-size="11.5" fill="#1d2a2e">противопоказания, выявленные врачом: клинику кухня не назначает.</text>
<path d="M12.0,653.0 L38.0,653.0" stroke="#c08a2d" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
<text x="46.0" y="657.0" font-size="11" fill="#5b6b73">первые примерно две недели после старта могут быть завышены самим наблюдением (эффект</text><text x="46.0" y="671.0" font-size="11" fill="#5b6b73">Хоторна) — рабочее допущение, а не измеренная величина</text>
<text x="12.0" y="689.0" font-size="11.5" font-weight="600" fill="#1f6f6a">Пилот проверяет осуществимость и безопасность, а не эффект вариативности (раздел 35.4а).</text>
</svg>
