<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 743" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Путь жалобы на питание: регистрация, разбор по протоколу за три рабочих дня, ответ по существу, вывод для системы; предельный срок ответа — тридцать дней по 59-ФЗ; внешний контур — прокуратура с представлением и месячным сроком мер и Роспотребнадзор с контрольным мероприятием и сроками досудебного обжалования по 248-ФЗ">
<title>Путь жалобы на питание: регистрация, разбор по протоколу за три рабочих дня, ответ по существу, вывод для системы; предельный срок ответа — тридцать дней по 59-ФЗ; внешний контур — прокуратура с представлением и месячным сроком мер и Роспотребнадзор с контрольным мероприятием и сроками досудебного обжалования по 248-ФЗ</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="743" fill="#ffffff"/>
<text x="12.0" y="22.0" font-size="12" font-weight="600" fill="#5b6b73">Внутренний контур: жалоба разбирается в днях, а не в неделях (приложение 34, кейс 19)</text>
<rect x="12.0" y="32.0" width="152.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="52.0" font-size="12.5" font-weight="600" fill="#1d2a2e">1. Жалоба</text><text x="22.0" y="70.8" font-size="11" fill="#1d2a2e">Жителя, семьи,</text><text x="22.0" y="84.8" font-size="11" fill="#1d2a2e">совета;</text><text x="22.0" y="98.8" font-size="11" fill="#1d2a2e">регистрируется с</text><text x="22.0" y="112.8" font-size="11" fill="#1d2a2e">отметкой о дате.</text><text x="22.0" y="126.8" font-size="11" fill="#1d2a2e">Жалоба с копией в</text><text x="22.0" y="140.8" font-size="11" fill="#1d2a2e">прокуратуру не</text><text x="22.0" y="154.8" font-size="11" fill="#1d2a2e">делегируется:</text><text x="22.0" y="168.8" font-size="11" fill="#1d2a2e">отвечает директор</text><text x="22.0" y="182.8" font-size="11" fill="#1d2a2e">лично</text>
<line x1="166.0" y1="113.5" x2="178.0" y2="113.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="12.0" y="203.0" width="152.0" height="24.0" rx="12" fill="#ffffff" stroke="#1f6f6a" stroke-width="1"/>
<text x="88.0" y="220.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">день регистрации</text>
<rect x="180.0" y="32.0" width="152.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="190.0" y="52.0" font-size="12.5" font-weight="600" fill="#1d2a2e">2. Разбор</text><text x="190.0" y="70.8" font-size="11" fill="#1d2a2e">Факты: меню за</text><text x="190.0" y="84.8" font-size="11" fill="#1d2a2e">месяц, журнал замен,</text><text x="190.0" y="98.8" font-size="11" fill="#1d2a2e">масса тела; звонок и</text><text x="190.0" y="112.8" font-size="11" fill="#1d2a2e">приглашение на обед;</text><text x="190.0" y="126.8" font-size="11" fill="#1d2a2e">протокол по</text><text x="190.0" y="140.8" font-size="11" fill="#1d2a2e">приложению 34</text>
<line x1="334.0" y1="113.5" x2="346.0" y2="113.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="180.0" y="203.0" width="152.0" height="38.0" rx="12" fill="#ffffff" stroke="#1f6f6a" stroke-width="1"/>
<text x="256.0" y="220.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">протокол — 3</text><text x="256.0" y="234.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">рабочих дня</text>
<rect x="348.0" y="32.0" width="152.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="358.0" y="52.0" font-size="12.5" font-weight="600" fill="#1d2a2e">3. Ответ по</text><text x="358.0" y="68.0" font-size="12.5" font-weight="600" fill="#1d2a2e">существу</text><text x="358.0" y="86.8" font-size="11" fill="#1d2a2e">Что проверено, что не</text><text x="358.0" y="100.8" font-size="11" fill="#1d2a2e">подтвердилось, что</text><text x="358.0" y="114.8" font-size="11" fill="#1d2a2e">подтвердилось и что</text><text x="358.0" y="128.8" font-size="11" fill="#1d2a2e">меняется — с датами;</text><text x="358.0" y="142.8" font-size="11" fill="#1d2a2e">памятка</text><text x="358.0" y="156.8" font-size="11" fill="#1d2a2e">родственникам</text>
<line x1="502.0" y1="113.5" x2="514.0" y2="113.5" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="348.0" y="203.0" width="152.0" height="38.0" rx="12" fill="#ffffff" stroke="#1f6f6a" stroke-width="1"/>
<text x="424.0" y="220.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">регламент дома —</text><text x="424.0" y="234.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">до 10 рабочих дней</text>
<rect x="516.0" y="32.0" width="152.0" height="163.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="526.0" y="52.0" font-size="12.5" font-weight="600" fill="#1d2a2e">4. Вывод для</text><text x="526.0" y="68.0" font-size="12.5" font-weight="600" fill="#1d2a2e">системы</text><text x="526.0" y="86.8" font-size="11" fill="#1d2a2e">Одна строка: что</text><text x="526.0" y="100.8" font-size="11" fill="#1d2a2e">меняется в</text><text x="526.0" y="114.8" font-size="11" fill="#1d2a2e">регламентах, картах,</text><text x="526.0" y="128.8" font-size="11" fill="#1d2a2e">меню; при</text><text x="526.0" y="142.8" font-size="11" fill="#1d2a2e">монотонности —</text><text x="526.0" y="156.8" font-size="11" fill="#1d2a2e">пилот или дегустация</text><text x="526.0" y="170.8" font-size="11" fill="#1d2a2e">совета</text>
<rect x="516.0" y="203.0" width="152.0" height="24.0" rx="12" fill="#ffffff" stroke="#1f6f6a" stroke-width="1"/>
<text x="592.0" y="220.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1f6f6a">одна строка</text>
<rect x="12.0" y="251.0" width="656.0" height="49.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="22.0" y="270.6" font-size="12" font-weight="600" fill="#a63d32">Клинический сюжет (удушье, отказ, не та текстура) — разбор с участием врача: клинику</text><text x="22.0" y="286.6" font-size="12" font-weight="600" fill="#a63d32">кухня не назначает</text>
<rect x="12.0" y="310.0" width="656.0" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5"/><text x="22.0" y="330.0" font-size="12.5" font-weight="600" fill="#1d2a2e">Предельный срок письменного ответа — 30 дней со дня регистрации (ст. 10, 12</text><text x="22.0" y="346.0" font-size="12.5" font-weight="600" fill="#1d2a2e">закона № 59-ФЗ)</text><text x="22.0" y="364.8" font-size="11" fill="#1d2a2e">Закон распространяется на учреждения, выполняющие публично значимые функции; применимость к</text><text x="22.0" y="378.8" font-size="11" fill="#1d2a2e">конкретному дому — толкование, но его требования — хороший минимальный стандарт ответа</text>
<text x="340.0" y="417.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#5b6b73">если жалобу не услышали — надзор</text>
<rect x="12.0" y="435.0" width="322.0" height="238.0" rx="6" fill="#f3f5f6" stroke="#5b6b73" stroke-width="1.5"/>
<text x="22.0" y="455.0" font-size="13.5" font-weight="700" fill="#1d2a2e">Прокуратура</text>
<text x="22.0" y="473.0" font-size="11" fill="#5b6b73">права жителей: ст. 37 и 43 закона № 3185-1</text>
<rect x="22.0" y="497.0" width="302.0" height="65.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="32.0" y="516.6" font-size="12" font-weight="600" fill="#1d2a2e">Проверка по жалобе</text><text x="32.0" y="535.8" font-size="11" fill="#1d2a2e">чаще всего — о правах; ответом служат</text><text x="32.0" y="549.8" font-size="11" fill="#1d2a2e">журнал отказов и документированный выбор</text>
<line x1="173.0" y1="565.0" x2="173.0" y2="581.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="22.0" y="584.0" width="302.0" height="79.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="32.0" y="603.6" font-size="12" font-weight="600" fill="#1d2a2e">Представление прокурора</text><text x="32.0" y="622.8" font-size="11" fill="#1d2a2e">рассматривается безотлагательно; в течение</text><text x="32.0" y="636.8" font-size="11" fill="#1d2a2e">месяца — меры и письменное сообщение</text><text x="32.0" y="650.8" font-size="11" fill="#1d2a2e">прокурору (ст. 24 Закона о прокуратуре)</text>
<path d="M173.0,393.0 L173.0,432.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<rect x="346.0" y="435.0" width="322.0" height="238.0" rx="6" fill="#f3f5f6" stroke="#5b6b73" stroke-width="1.5"/>
<text x="356.0" y="455.0" font-size="13.5" font-weight="700" fill="#1d2a2e">Роспотребнадзор</text>
<text x="356.0" y="473.0" font-size="11" fill="#5b6b73">санитария: температура, маркировка, суточные</text><text x="356.0" y="487.0" font-size="11" fill="#5b6b73">пробы, поточность</text>
<rect x="356.0" y="497.0" width="302.0" height="65.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="366.0" y="516.6" font-size="12" font-weight="600" fill="#1d2a2e">Контрольное мероприятие по 248-ФЗ</text><text x="366.0" y="535.8" font-size="11" fill="#1d2a2e">акт, при нарушениях — предписание;</text><text x="366.0" y="549.8" font-size="11" fill="#1d2a2e">несогласие — письменно, а не в коридоре</text>
<line x1="507.0" y1="565.0" x2="507.0" y2="581.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="356.0" y="584.0" width="302.0" height="79.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/><text x="366.0" y="603.6" font-size="12" font-weight="600" fill="#1d2a2e">Досудебная жалоба через Госуслуги</text><text x="366.0" y="622.8" font-size="11" fill="#1d2a2e">на решение и действие — 30 календарных</text><text x="366.0" y="636.8" font-size="11" fill="#1d2a2e">дней, на предписание — 10 рабочих дней;</text><text x="366.0" y="650.8" font-size="11" fill="#1d2a2e">рассмотрение — 15 рабочих дней</text>
<path d="M507.0,393.0 L507.0,432.0" stroke="#5b6b73" stroke-width="1.5" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="12.0" y="695.0" font-size="11.5" font-weight="600" fill="#1f6f6a">«Прокурорские» сюжеты вырастают из жалоб, которые игнорировались месяц. Дом, который</text><text x="12.0" y="710.0" font-size="11.5" font-weight="600" fill="#1f6f6a">отвечает быстрее, чем требует прокурор, редко получает второе представление (раздел 33.6).</text>
<text x="12.0" y="731.0" font-size="11" font-style="italic" fill="#5b6b73">Сроки — по текстам законов на дату проверки 09.10.2026; перед подачей сверить с действующей редакцией.</text>
</svg>
