<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Схема пары эквивалентных блюд: три фильтра (норма, поток, спрос), что должно совпадать и что может различаться, рабочие пары и антипримеры">
<title>Схема пары эквивалентных блюд: три фильтра (норма, поток, спрос), что должно совпадать и что может различаться, рабочие пары и антипримеры</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="684" fill="#ffffff"/>
<text x="12.0" y="22.0" font-size="12" fill="#5b6b73">Вариант Б становится парой варианту А, только если проходит три фильтра (раздел 19.2)</text>
<rect x="12.0" y="34.0" width="196.0" height="86.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="54.4" font-size="13" font-weight="600" fill="#1d2a2e">1. Норма</text><text x="22.0" y="74.6" font-size="12" fill="#1d2a2e">Та же норма белка и круп</text><text x="22.0" y="90.6" font-size="12" fill="#1d2a2e">по таблице замен, что у</text><text x="22.0" y="106.6" font-size="12" fill="#1d2a2e">варианта А</text>
<line x1="212.0" y1="77.0" x2="238.0" y2="77.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="242.0" y="34.0" width="196.0" height="86.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="252.0" y="54.4" font-size="13" font-weight="600" fill="#1d2a2e">2. Поток</text><text x="252.0" y="74.6" font-size="12" fill="#1d2a2e">Готовится на том же</text><text x="252.0" y="90.6" font-size="12" fill="#1d2a2e">оборудовании: печь, котёл,</text><text x="252.0" y="106.6" font-size="12" fill="#1d2a2e">доска</text>
<line x1="442.0" y1="77.0" x2="468.0" y2="77.0" stroke="#1d2a2e" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="472.0" y="34.0" width="196.0" height="86.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="482.0" y="54.4" font-size="13" font-weight="600" fill="#1d2a2e">3. Спрос</text><text x="482.0" y="74.6" font-size="12" fill="#1d2a2e">Интерес к блюду уже</text><text x="482.0" y="90.6" font-size="12" fill="#1d2a2e">виден по журналам</text><text x="482.0" y="106.6" font-size="12" fill="#1d2a2e">прошлых недель</text>
<rect x="12.0" y="138.0" width="321.0" height="209.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="22.0" y="159.0" font-size="14" font-weight="600" fill="#1d2a2e">Должно совпадать</text>
<circle cx="26.0" cy="176.0" r="3" fill="#1f6f6a"/><text x="36.0" y="180.0" font-size="12" fill="#1d2a2e">Основное пищевое вещество позиции:</text><text x="36.0" y="196.0" font-size="12" fill="#1d2a2e">белок у второго блюда, углеводы у каши</text><circle cx="26.0" cy="213.0" r="3" fill="#1f6f6a"/><text x="36.0" y="217.0" font-size="12" fill="#1d2a2e">Технологический поток: без новой зоны,</text><text x="36.0" y="233.0" font-size="12" fill="#1d2a2e">оборудования и маршрута</text><circle cx="26.0" cy="250.0" r="3" fill="#1f6f6a"/><text x="36.0" y="254.0" font-size="12" fill="#1d2a2e">Ранг: оба варианта — «настоящие» блюда</text><circle cx="26.0" cy="271.0" r="3" fill="#1f6f6a"/><text x="36.0" y="275.0" font-size="12" fill="#1d2a2e">Доступность: выбор у линии, без заявки за</text><text x="36.0" y="291.0" font-size="12" fill="#1d2a2e">неделю</text><circle cx="26.0" cy="308.0" r="3" fill="#1f6f6a"/><text x="36.0" y="312.0" font-size="12" fill="#1d2a2e">Свежесть и подача: не холодное и не</text><text x="36.0" y="328.0" font-size="12" fill="#1d2a2e">вчерашнее</text>
<rect x="347.0" y="138.0" width="321.0" height="209.0" rx="6" fill="#ffffff" stroke="#5b6b73" stroke-width="1.5"/>
<text x="357.0" y="159.0" font-size="14" font-weight="600" fill="#1d2a2e">Может различаться</text>
<circle cx="361.0" cy="176.0" r="3" fill="#5b6b73"/><text x="371.0" y="180.0" font-size="12" fill="#1d2a2e">Форма из одной заготовки: котлета или</text><text x="371.0" y="196.0" font-size="12" fill="#1d2a2e">тефтели, тушёное мясо или печёночный</text><text x="371.0" y="212.0" font-size="12" fill="#1d2a2e">соус</text><circle cx="361.0" cy="229.0" r="3" fill="#5b6b73"/><text x="371.0" y="233.0" font-size="12" fill="#1d2a2e">Вид крупы: гречка, рис, пшено, овсянка —</text><text x="371.0" y="249.0" font-size="12" fill="#1d2a2e">по таблицам замен</text><circle cx="361.0" cy="266.0" r="3" fill="#5b6b73"/><text x="371.0" y="270.0" font-size="12" fill="#1d2a2e">Овощ в салате: свекольный или морковный,</text><text x="371.0" y="286.0" font-size="12" fill="#1d2a2e">капустный или винегрет</text><circle cx="361.0" cy="303.0" r="3" fill="#5b6b73"/><text x="371.0" y="307.0" font-size="12" fill="#1d2a2e">Вкус и способ приготовления — пара</text><text x="371.0" y="323.0" font-size="12" fill="#1d2a2e">должна быть различимой</text>
<text x="12.0" y="375.0" font-size="12" font-weight="600" fill="#5b6b73">Рабочие пары, проверенные практикой</text>
<rect x="12.0" y="383.0" width="124.8" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="402.6" font-size="12" font-weight="600" fill="#1d2a2e">Крупы</text><text x="22.0" y="421.8" font-size="11" fill="#1d2a2e">гречка · рис ·</text><text x="22.0" y="435.8" font-size="11" fill="#1d2a2e">пшено · овсянка</text>
<rect x="144.8" y="383.0" width="124.8" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="154.8" y="402.6" font-size="12" font-weight="600" fill="#1d2a2e">Вторые</text><text x="154.8" y="421.8" font-size="11" fill="#1d2a2e">котлета /</text><text x="154.8" y="435.8" font-size="11" fill="#1d2a2e">тефтели; рыба</text><text x="154.8" y="449.8" font-size="11" fill="#1d2a2e">запечённая /</text><text x="154.8" y="463.8" font-size="11" fill="#1d2a2e">рыбные биточки</text>
<rect x="277.6" y="383.0" width="124.8" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="287.6" y="402.6" font-size="12" font-weight="600" fill="#1d2a2e">Салаты</text><text x="287.6" y="421.8" font-size="11" fill="#1d2a2e">свекольный /</text><text x="287.6" y="435.8" font-size="11" fill="#1d2a2e">морковный;</text><text x="287.6" y="449.8" font-size="11" fill="#1d2a2e">капустный /</text><text x="287.6" y="463.8" font-size="11" fill="#1d2a2e">винегрет</text>
<rect x="410.4" y="383.0" width="124.8" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="420.4" y="402.6" font-size="12" font-weight="600" fill="#1d2a2e">Напитки</text><text x="420.4" y="421.8" font-size="11" fill="#1d2a2e">чай · какао ·</text><text x="420.4" y="435.8" font-size="11" fill="#1d2a2e">кофейный</text><text x="420.4" y="449.8" font-size="11" fill="#1d2a2e">напиток; компот ·</text><text x="420.4" y="463.8" font-size="11" fill="#1d2a2e">морс</text>
<rect x="543.2" y="383.0" width="124.8" height="93.0" rx="6" fill="#ffffff" stroke="#1f6f6a" stroke-width="1.5"/><text x="553.2" y="402.6" font-size="12" font-weight="600" fill="#1d2a2e">Первые</text><text x="553.2" y="421.8" font-size="11" fill="#1d2a2e">борщ / щи — если</text><text x="553.2" y="435.8" font-size="11" fill="#1d2a2e">кухня держит</text><text x="553.2" y="449.8" font-size="11" fill="#1d2a2e">два котла</text>
<rect x="12.0" y="486.0" width="656.0" height="69.0" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/><text x="22.0" y="505.6" font-size="12" font-weight="600" fill="#1d2a2e">Какао и кофейный напиток — кофеиновая строка пищевой карты</text><text x="22.0" y="525.6" font-size="12" fill="#1d2a2e">Кофеин влияет на концентрацию клозапина (раздел 11): кому их можно, решает врач. Клинику</text><text x="22.0" y="541.6" font-size="12" fill="#1d2a2e">кухня не назначает.</text>
<text x="12.0" y="583.0" font-size="12" font-weight="600" fill="#5b6b73">Что не является парой (раздел 19.9)</text>
<rect x="12.0" y="591.0" width="124.8" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="22.0" y="610.6" font-size="12" font-weight="600" fill="#1d2a2e">То же блюдо</text><text x="22.0" y="626.6" font-size="12" font-weight="600" fill="#1d2a2e">«без всего»</text>
<rect x="144.8" y="591.0" width="124.8" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="154.8" y="610.6" font-size="12" font-weight="600" fill="#1d2a2e">Второй</text><text x="154.8" y="626.6" font-size="12" font-weight="600" fill="#1d2a2e">вариант — по</text><text x="154.8" y="642.6" font-size="12" font-weight="600" fill="#1d2a2e">заявке за</text><text x="154.8" y="658.6" font-size="12" font-weight="600" fill="#1d2a2e">неделю</text>
<rect x="277.6" y="591.0" width="124.8" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="287.6" y="610.6" font-size="12" font-weight="600" fill="#1d2a2e">То же, но</text><text x="287.6" y="626.6" font-size="12" font-weight="600" fill="#1d2a2e">холодное или</text><text x="287.6" y="642.6" font-size="12" font-weight="600" fill="#1d2a2e">вчерашнее</text>
<rect x="410.4" y="591.0" width="124.8" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="420.4" y="610.6" font-size="12" font-weight="600" fill="#1d2a2e">«Настоящее</text><text x="420.4" y="626.6" font-size="12" font-weight="600" fill="#1d2a2e">или то, что</text><text x="420.4" y="642.6" font-size="12" font-weight="600" fill="#1d2a2e">осталось»</text>
<rect x="543.2" y="591.0" width="124.8" height="81.0" rx="6" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="553.2" y="610.6" font-size="12" font-weight="600" fill="#1d2a2e">Гречка с</text><text x="553.2" y="626.6" font-size="12" font-weight="600" fill="#1d2a2e">котлетой и</text><text x="553.2" y="642.6" font-size="12" font-weight="600" fill="#1d2a2e">гречка с</text><text x="553.2" y="658.6" font-size="12" font-weight="600" fill="#1d2a2e">подливой</text>
</svg>
