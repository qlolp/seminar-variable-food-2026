<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 844" font-family="Inter, 'DejaVu Sans', sans-serif" role="img" aria-label="Таблица-схема российских публичных практик вариативного питания по регионам: учреждение, модель М1–М3 или персонализация, дата старта и что известно; Иркутская область показана как четыре учреждения с разными моделями из одного сообщения министерства плюс Усть-Илимский ДСО; внизу — что подтверждает публикация и чего не знаем">
<title>Таблица-схема российских публичных практик вариативного питания по регионам: учреждение, модель М1–М3 или персонализация, дата старта и что известно; Иркутская область показана как четыре учреждения с разными моделями из одного сообщения министерства плюс Усть-Илимский ДСО; внизу — что подтверждает публикация и чего не знаем</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2a2e"/></marker></defs>
<rect x="0" y="0" width="680" height="844" fill="#ffffff"/>
<rect x="12.0" y="10.0" width="656.0" height="26.0" rx="4" fill="#1d2a2e"/>
<text x="20.0" y="27.5" font-size="12" font-weight="600" fill="#ffffff">Учреждение</text>
<text x="216.0" y="27.5" font-size="12" font-weight="600" fill="#ffffff">Модель</text>
<text x="332.0" y="27.5" font-size="12" font-weight="600" fill="#ffffff">Старт</text>
<text x="432.0" y="27.5" font-size="12" font-weight="600" fill="#ffffff">Что известно из публикации</text>
<rect x="12.0" y="40.0" width="656.0" height="20.0" rx="3" fill="#eef1f2"/>
<text x="20.0" y="54.0" font-size="11" font-weight="600" fill="#5b6b73">Свердловская область</text>
<text x="20.0" y="79.0" font-size="12" font-weight="600" fill="#1d2a2e">Березовский ПНИ</text>
<rect x="216.0" y="67.0" width="38.4" height="18.0" rx="9" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.2"/>
<text x="235.2" y="80.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М3*</text>
<text x="332.0" y="79.0" font-size="11" fill="#1d2a2e">апрель 2013</text>
<text x="432.0" y="79.0" font-size="11" fill="#1d2a2e">«Шведский стол»: несколько салатов,</text><text x="432.0" y="93.0" font-size="11" fill="#1d2a2e">первых и вторых; меню на неделю.</text><text x="432.0" y="107.0" font-size="11" fill="#1d2a2e">Судьба практики неизвестна</text>
<line x1="12.0" y1="116.0" x2="668.0" y2="116.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="12.0" y="116.0" width="656.0" height="20.0" rx="3" fill="#eef1f2"/>
<text x="20.0" y="130.0" font-size="11" font-weight="600" fill="#5b6b73">Новосибирская область</text>
<text x="20.0" y="155.0" font-size="12" font-weight="600" fill="#1d2a2e">Болотнинский ПНИ</text>
<rect x="216.0" y="143.0" width="32.6" height="18.0" rx="9" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="232.3" y="156.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М1</text>
<text x="332.0" y="155.0" font-size="11" fill="#1d2a2e">2024</text>
<text x="432.0" y="155.0" font-size="11" fill="#1d2a2e">Несколько раз в неделю, завтрак и</text><text x="432.0" y="169.0" font-size="11" fill="#1d2a2e">обед; перечень блюд определяет</text><text x="432.0" y="183.0" font-size="11" fill="#1d2a2e">диетсестра</text>
<line x1="12.0" y1="192.0" x2="668.0" y2="192.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="20.0" y="209.0" font-size="12" font-weight="600" fill="#1d2a2e">Успенский ПНИ</text>
<rect x="216.0" y="197.0" width="32.6" height="18.0" rx="9" fill="#1f6f6a" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="232.3" y="210.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">М2</text>
<text x="332.0" y="209.0" font-size="11" fill="#1d2a2e">март 2024</text>
<text x="432.0" y="209.0" font-size="11" fill="#1d2a2e">Ежедневно во всех отделениях: два</text><text x="432.0" y="223.0" font-size="11" fill="#1d2a2e">вторых, два салата, два напитка</text>
<line x1="12.0" y1="232.0" x2="668.0" y2="232.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="12.0" y="232.0" width="656.0" height="20.0" rx="3" fill="#eef1f2"/>
<text x="20.0" y="246.0" font-size="11" font-weight="600" fill="#5b6b73">Иркутская область</text>
<text x="20.0" y="271.0" font-size="12" font-weight="600" fill="#1d2a2e">Усть-Илимский ДСО</text>
<rect x="216.0" y="259.0" width="60.4" height="18.0" rx="9" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="246.2" y="272.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М1→М2</text>
<text x="332.0" y="271.0" font-size="11" fill="#1d2a2e">сентябрь</text><text x="332.0" y="285.0" font-size="11" fill="#1d2a2e">2024</text>
<text x="432.0" y="271.0" font-size="11" fill="#1d2a2e">Поэтапно, первыми — мобильные</text><text x="432.0" y="285.0" font-size="11" fill="#1d2a2e">жители; опрос предпочтений,</text><text x="432.0" y="299.0" font-size="11" fill="#1d2a2e">группировка блюд по популярности</text>
<line x1="12.0" y1="308.0" x2="668.0" y2="308.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="26.0" y="308.0" width="642.0" height="36.0" rx="3" fill="#f5e9d2"/>
<text x="36.0" y="322.0" font-size="11" font-weight="600" fill="#1d2a2e">Сообщение министерства (14.02.2025): четыре учреждения — у каждого своя модель, это не</text><text x="36.0" y="336.0" font-size="11" font-weight="600" fill="#1d2a2e">региональная норма</text>
<text x="34.0" y="363.0" font-size="12" font-weight="600" fill="#1d2a2e">«Лидер», Усть-Илимск</text>
<rect x="216.0" y="351.0" width="56.7" height="18.0" rx="9" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="244.4" y="364.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М1–М2</text>
<text x="332.0" y="363.0" font-size="11" fill="#5b6b73">нет данных</text>
<text x="432.0" y="363.0" font-size="11" fill="#1d2a2e">220 человек, восемь видов меню,</text><text x="432.0" y="377.0" font-size="11" fill="#1d2a2e">выбор в обед</text>
<line x1="26.0" y1="386.0" x2="668.0" y2="386.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="34.0" y="403.0" font-size="12" font-weight="600" fill="#1d2a2e">Чунский ПНИ «Радуга»</text>
<rect x="216.0" y="391.0" width="32.6" height="18.0" rx="9" fill="#f5e9d2" stroke="#c08a2d" stroke-width="1.2"/>
<text x="232.3" y="404.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М3</text>
<text x="332.0" y="403.0" font-size="11" fill="#1d2a2e">февраль 2023</text>
<text x="432.0" y="403.0" font-size="11" fill="#1d2a2e">Зона самообслуживания; для тех, кто</text><text x="432.0" y="417.0" font-size="11" fill="#1d2a2e">не может жевать, — своя протёртая</text><text x="432.0" y="431.0" font-size="11" fill="#1d2a2e">линия</text>
<line x1="26.0" y1="440.0" x2="668.0" y2="440.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="34.0" y="457.0" font-size="12" font-weight="600" fill="#1d2a2e">Ново-Ленинский ДИ</text>
<rect x="216.0" y="445.0" width="56.7" height="18.0" rx="9" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="244.4" y="458.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М1–М2</text>
<text x="332.0" y="457.0" font-size="11" fill="#5b6b73">нет данных</text>
<text x="432.0" y="457.0" font-size="11" fill="#1d2a2e">Завтрак и обед: сначала активное</text><text x="432.0" y="471.0" font-size="11" fill="#1d2a2e">долголетие, затем милосердие</text>
<line x1="26.0" y1="480.0" x2="668.0" y2="480.0" stroke="#c9d1d4" stroke-width="1"/>
<text x="34.0" y="497.0" font-size="12" font-weight="600" fill="#1d2a2e">Марковский центр</text>
<rect x="216.0" y="485.0" width="32.6" height="18.0" rx="9" fill="#1f6f6a" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="232.3" y="498.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">М2</text>
<text x="332.0" y="497.0" font-size="11" fill="#1d2a2e">сентябрь</text><text x="332.0" y="511.0" font-size="11" fill="#1d2a2e">2024</text>
<text x="432.0" y="497.0" font-size="11" fill="#1d2a2e">Два первых, два вторых, гарниры —</text><text x="432.0" y="511.0" font-size="11" fill="#1d2a2e">только одно отделение</text>
<line x1="26.0" y1="520.0" x2="668.0" y2="520.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="12.0" y="520.0" width="656.0" height="20.0" rx="3" fill="#eef1f2"/>
<text x="20.0" y="534.0" font-size="11" font-weight="600" fill="#5b6b73">Санкт-Петербург</text>
<text x="20.0" y="559.0" font-size="12" font-weight="600" fill="#1d2a2e">ДСО «Серафимовский»</text>
<rect x="216.0" y="547.0" width="32.6" height="18.0" rx="9" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.2"/>
<text x="232.3" y="560.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2a2e">М1</text>
<text x="332.0" y="559.0" font-size="11" fill="#1d2a2e">сообщено в</text><text x="332.0" y="573.0" font-size="11" fill="#1d2a2e">июле 2025</text>
<text x="432.0" y="559.0" font-size="11" fill="#1d2a2e">Заказ накануне для части жителей;</text><text x="432.0" y="573.0" font-size="11" fill="#1d2a2e">оборудование и ставки; с 2026 года —</text><text x="432.0" y="587.0" font-size="11" fill="#1d2a2e">в правилах распорядка</text>
<line x1="12.0" y1="596.0" x2="668.0" y2="596.0" stroke="#c9d1d4" stroke-width="1"/>
<rect x="12.0" y="596.0" width="656.0" height="20.0" rx="3" fill="#eef1f2"/>
<text x="20.0" y="610.0" font-size="11" font-weight="600" fill="#5b6b73">Московская область</text>
<text x="20.0" y="635.0" font-size="12" font-weight="600" fill="#1d2a2e">ДДСОЛ</text>
<rect x="216.0" y="623.0" width="44.3" height="18.0" rx="9" fill="#ffffff" stroke="#5b6b73" stroke-width="1.2"/>
<text x="238.2" y="636.0" font-size="11" font-weight="600" text-anchor="middle" fill="#5b6b73">иное</text>
<text x="332.0" y="635.0" font-size="11" fill="#5b6b73">нет данных</text>
<text x="432.0" y="635.0" font-size="11" fill="#1d2a2e">Персонализация внутри нормы:</text><text x="432.0" y="649.0" font-size="11" fill="#1d2a2e">замены по желанию с врачом, совет</text><text x="432.0" y="663.0" font-size="11" fill="#1d2a2e">по питанию; не вариативность в</text><text x="432.0" y="677.0" font-size="11" fill="#1d2a2e">строгом смысле</text>
<line x1="12.0" y1="686.0" x2="668.0" y2="686.0" stroke="#c9d1d4" stroke-width="1"/>
<line x1="18.0" y1="308.0" x2="18.0" y2="520.0" stroke="#c08a2d" stroke-width="3"/>
<text x="12.0" y="704.0" font-size="11" font-style="italic" fill="#5b6b73">Модели М0–М5 — раздел 8; классификация — толкование доклада, а не слова учреждений. * — по описанию в</text><text x="12.0" y="718.0" font-size="11" font-style="italic" fill="#5b6b73">новости.</text>
<rect x="12.0" y="730.0" width="322.0" height="102.0" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/><text x="22.0" y="750.4" font-size="13" font-weight="600" fill="#1d2a2e">Что подтверждает публикация</text><text x="22.0" y="770.6" font-size="12" fill="#1d2a2e">Факт сообщения на дату: модель, точки</text><text x="22.0" y="786.6" font-size="12" fill="#1d2a2e">выбора, порой — охват и ответственного</text>
<rect x="346.0" y="730.0" width="322.0" height="102.0" rx="6" fill="#ffffff" stroke="#c08a2d" stroke-width="1.5" stroke-dasharray="5 3"/><text x="356.0" y="750.4" font-size="13" font-weight="600" fill="#1d2a2e">Чего не знаем ни по одному кейсу</text><text x="356.0" y="770.6" font-size="12" fill="#1d2a2e">Сколько жителей реально выбирают и как</text><text x="356.0" y="786.6" font-size="12" fill="#1d2a2e">выбирают неговорящие; экономику сырьевой</text><text x="356.0" y="802.6" font-size="12" fill="#1d2a2e">строки; отходы; устойчивость сегодня;</text><text x="356.0" y="818.6" font-size="12" fill="#1d2a2e">вопросы проверяющих</text>
</svg>
