<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 511" font-family="Inter, 'DejaVu Sans', sans-serif" fill="#1d2a2e" role="img">
<title>Прибавка веса на антипсихотиках и пищевое поведение</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b73"/></marker></defs>
<rect width="680" height="511" fill="#ffffff"/>
<text x="0" y="16" font-size="13" font-weight="600">Доля пациентов с прибавкой 7 % массы тела и более</text>
<text x="0" y="33" font-size="11.5" fill="#5b6b73">длительное лечение, около 38 недель</text>
<line x1="150" y1="44" x2="150" y2="146" stroke="#c9d1d4" stroke-width="1"/>
<text x="150" y="161" font-size="11" fill="#5b6b73" text-anchor="middle">0 %</text>
<line x1="272.5" y1="44" x2="272.5" y2="146" stroke="#c9d1d4" stroke-width="1"/>
<text x="272.5" y="161" font-size="11" fill="#5b6b73" text-anchor="middle">25 %</text>
<line x1="395" y1="44" x2="395" y2="146" stroke="#c9d1d4" stroke-width="1"/>
<text x="395" y="161" font-size="11" fill="#5b6b73" text-anchor="middle">50 %</text>
<line x1="517.5" y1="44" x2="517.5" y2="146" stroke="#c9d1d4" stroke-width="1"/>
<text x="517.5" y="161" font-size="11" fill="#5b6b73" text-anchor="middle">75 %</text>
<line x1="640" y1="44" x2="640" y2="146" stroke="#c9d1d4" stroke-width="1"/>
<text x="640" y="161" font-size="11" fill="#5b6b73" text-anchor="middle">100 %</text>
<text x="140" y="63.5" font-size="12.5" text-anchor="end">Клозапин</text>
<path d="M150,48 L519.87,48 Q523.87,48 523.87,52 L523.87,66 Q523.87,70 519.87,70 L150,70 Z" fill="#1f6f6a" stroke="none" stroke-width="0"/>
<text x="529.87" y="63.5" font-size="12.5" font-weight="600">76,3 %</text>
<text x="140" y="99.5" font-size="12.5" text-anchor="end">Оланзапин</text>
<path d="M150,84 L326.81,84 Q330.81,84 330.81,88 L330.81,102 Q330.81,106 326.81,106 L150,106 Z" fill="#1f6f6a" stroke="none" stroke-width="0"/>
<text x="336.81" y="99.5" font-size="12.5" font-weight="600">36,9 %</text>
<text x="140" y="135.5" font-size="12.5" text-anchor="end">Рисперидон</text>
<path d="M150,120 L258.7,120 Q262.7,120 262.7,124 L262.7,138 Q262.7,142 258.7,142 L150,142 Z" fill="#1f6f6a" stroke="none" stroke-width="0"/>
<text x="268.7" y="135.5" font-size="12.5" font-weight="600">23,0 %</text>
<text x="0" y="190" font-size="13" font-weight="600">Пищевое поведение при тяжёлых психических расстройствах</text>
<text x="0" y="207" font-size="11.5" fill="#5b6b73">диапазоны частоты в разных исследованиях</text>
<line x1="150" y1="218" x2="150" y2="320" stroke="#c9d1d4" stroke-width="1"/>
<text x="150" y="335" font-size="11" fill="#5b6b73" text-anchor="middle">0 %</text>
<line x1="272.5" y1="218" x2="272.5" y2="320" stroke="#c9d1d4" stroke-width="1"/>
<text x="272.5" y="335" font-size="11" fill="#5b6b73" text-anchor="middle">25 %</text>
<line x1="395" y1="218" x2="395" y2="320" stroke="#c9d1d4" stroke-width="1"/>
<text x="395" y="335" font-size="11" fill="#5b6b73" text-anchor="middle">50 %</text>
<line x1="517.5" y1="218" x2="517.5" y2="320" stroke="#c9d1d4" stroke-width="1"/>
<text x="517.5" y="335" font-size="11" fill="#5b6b73" text-anchor="middle">75 %</text>
<line x1="640" y1="218" x2="640" y2="320" stroke="#c9d1d4" stroke-width="1"/>
<text x="640" y="335" font-size="11" fill="#5b6b73" text-anchor="middle">100 %</text>
<text x="140" y="237.5" font-size="12.5" text-anchor="end">Переедание</text>
<line x1="171.56" y1="233" x2="370.5" y2="233" stroke="#1f6f6a" stroke-width="6"/>
<circle cx="171.6" cy="233.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<circle cx="370.5" cy="233.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<text x="380.5" y="237.5" font-size="12.5" font-weight="600">4,4–45 %</text>
<text x="140" y="273.5" font-size="12.5" text-anchor="end">Тяга к еде</text>
<line x1="228.89" y1="269" x2="463.6" y2="269" stroke="#1f6f6a" stroke-width="6"/>
<circle cx="228.9" cy="269.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<circle cx="463.6" cy="269.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<text x="473.6" y="273.5" font-size="12.5" font-weight="600">16,1–64 %</text>
<text x="140" y="309.5" font-size="12.5" text-anchor="end">Ночное едение</text>
<line x1="169.6" y1="305" x2="297" y2="305" stroke="#1f6f6a" stroke-width="6"/>
<circle cx="169.6" cy="305.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<circle cx="297.0" cy="305.0" r="5.5" fill="#1f6f6a" stroke="#ffffff" stroke-width="2"/>
<text x="307" y="309.5" font-size="12.5" font-weight="600">4–30 %</text>
<text x="0" y="366" font-size="13" font-weight="600">Что делает дом: вес как сигнал врачу</text>
<rect x="0" y="376" width="220" height="87" rx="6" fill="#d6ebe8" stroke="#1f6f6a" stroke-width="1.5"/>
<text x="10" y="398.5" font-size="12.5" font-weight="600" fill="#1f6f6a">Регламент</text>
<text x="10" y="417" font-size="12">взвешивание ежемесячно, на</text>
<text x="10" y="433" font-size="12">одних весах, в одно время</text>
<rect x="230" y="376" width="220" height="87" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/>
<text x="240" y="398.5" font-size="12.5" font-weight="600" fill="#a63d32">Набор</text>
<text x="240" y="417" font-size="12">прибавка более 5 % за</text>
<text x="240" y="433" font-size="12">квартал — сообщение врачу</text>
<rect x="460" y="376" width="220" height="87" rx="6" fill="#f4dcd8" stroke="#a63d32" stroke-width="1.5"/>
<text x="470" y="398.5" font-size="12.5" font-weight="600" fill="#a63d32">Потеря</text>
<text x="470" y="417" font-size="12">5 % за 30 дней, 7,5 % за 90,</text>
<text x="470" y="433" font-size="12">10 % за 180 — врачу в тот же</text>
<text x="470" y="449" font-size="12">день</text>
<text x="0" y="487" font-size="11.5" fill="#5b6b73">Зарубежные данные переносятся на российский дом как порядок величины, а не как оценка. Препарат, диету</text>
<text x="0" y="503" font-size="11.5" fill="#5b6b73">и лекарственную профилактику прибавки выбирает только врач; кухня даёт вес, журнал и карту.</text>
</svg>
